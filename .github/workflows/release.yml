name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Multiloader JARs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build

      - name: Collect release JARs
        shell: bash
        run: |
          mkdir -p release

          find fabric/build/libs \
               forge/build/libs \
               neoforge/build/libs \
               -maxdepth 1 \
               -type f \
               -name "*.jar" \
               ! -name "*-sources.jar" \
               ! -name "*-javadoc.jar" \
               ! -name "*-dev.jar" \
               ! -name "*-dev-shadow.jar" \
               ! -name "*-shadow.jar" \
               -exec cp {} release/ \;

          echo "Collected release files:"
          ls -lah release

          JAR_COUNT=$(find release -maxdepth 1 -type f -name "*.jar" | wc -l)

          if [ "$JAR_COUNT" -ne 3 ]; then
            echo "::error::Expected exactly 3 release JARs, but found $JAR_COUNT."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true